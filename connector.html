<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Autohaus Abrechnung Power-Up Connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script>
    window.TrelloPowerUp.initialize({
      'card-back-section': function (t) {
        return {
          title: '🚗 Autohaus Abrechnung',
          icon: 'https://cdn-icons-png.flaticon.com/512/2693/2693507.png',
          content: {
            type: 'iframe',
            url: './index.html',
            height: 520
          }
        };
      },
      'card-buttons': function (t) {
        return [{
          icon: 'https://cdn-icons-png.flaticon.com/512/2693/2693507.png',
          text: 'Abrechnung öffnen',
          callback: function (t) {
            return t.popup({
              title: 'Autohaus Abrechnung',
              url: './index.html',
              height: 520
            });
          }
        }];
      },
      'card-badges': async function (t) {
        const data = await t.getData('card', ['gesamtbetrag']);
        if (!data.gesamtbetrag) return [];
        return [{
          icon: 'https://cdn-icons-png.flaticon.com/512/2693/2693507.png',
          text: `${parseFloat(data.gesamtbetrag).toFixed(2)} €`,
          color: 'blue'
        }];
      }
    });
  </script>
</head>

<body>
</body>

</html>
