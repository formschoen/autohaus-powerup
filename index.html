<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autohaus Abrechnung Power-Up</title>
  
  <!-- Trello SDK laden -->
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 30px;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    
    .radio-group {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }
    
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: normal;
    }
    
    input[type="radio"],
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    select,
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    
    select:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .checkbox-group label:hover {
      background: #e8e8e8;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
    }
    
    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 30px;
    }
    
    button {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    #save-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    #save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    
    #abrechnung-btn {
      background: #f0f0f0;
      color: #333;
    }
    
    #abrechnung-btn:hover {
      background: #e0e0e0;
    }
    
    .hidden {
      display: none;
    }
    
    #berechnung-badge {
      margin-top: 20px;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚗 Autohaus Abrechnung</h1>
    <p class="subtitle">Wochenabrechnung für Fahrzeugreinigung</p>
    
    <form id="abrechnung-form">
      <!-- Abrechnungstyp -->
      <div class="form-group">
        <label>Abrechnungstyp:</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="abrechnungstyp" value="paket" checked>
            Paket-Abrechnung
          </label>
          <label>
            <input type="radio" name="abrechnungstyp" value="stunden">
            Stunden-Abrechnung
          </label>
        </div>
      </div>
      
      <!-- Paket-Auswahl -->
      <div class="form-group" id="paket-field">
        <label for="paket">Paket auswählen:</label>
        <select id="paket" required>
          <option value="">-- Bitte wählen --</option>
          <option value="innen_aussen|Innen & Außen|150">Innen & Außen - 150€</option>
          <option value="nur_innen|Nur Innen - Klein|80">Nur Innen - Klein - 80€</option>
          <option value="nur_innen_gross|Nur Innen - Groß|120">Nur Innen - Groß - 120€</option>
          <option value="aufbereitung|Komplettaufbereitung|300">Komplettaufbereitung - 300€</option>
          <option value="sonder|Sonderreinigung|200">Sonderreinigung - 200€</option>
        </select>
      </div>
      
      <!-- Stunden-Eingabe -->
      <div class="form-group hidden" id="stunden-field">
        <label for="stunden">Stunden eingeben:</label>
        <input type="number" id="stunden" min="0" step="0.5" placeholder="z.B. 3.5">
        <small style="color: #666; display: block; margin-top: 5px;">Preis: 85€ pro Stunde</small>
      </div>
      
      <!-- Standorte -->
      <div class="form-group">
        <label>Standorte:</label>
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="standort-1" value="Berlin" checked>
            Berlin
          </label>
          <label>
            <input type="checkbox" id="standort-2" value="Munich">
            Munich
          </label>
          <label>
            <input type="checkbox" id="standort-3" value="Hamburg">
            Hamburg
          </label>
          <label>
            <input type="checkbox" id="standort-4" value="Frankfurt">
            Frankfurt
          </label>
          <label>
            <input type="checkbox" id="standort-5" value="Cologne">
            Cologne
          </label>
          <label>
            <input type="checkbox" id="standort-6" value="Stuttgart">
            Stuttgart
          </label>
          <label>
            <input type="checkbox" id="standort-7" value="Dusseldorf">
            Dusseldorf
          </label>
          <label>
            <input type="checkbox" id="standort-8" value="Dortmund">
            Dortmund
          </label>
          <label>
            <input type="checkbox" id="standort-9" value="Essen">
            Essen
          </label>
          <label>
            <input type="checkbox" id="standort-10" value="Leipzig">
            Leipzig
          </label>
          <label>
            <input type="checkbox" id="standort-11" value="Bremen">
            Bremen
          </label>
          <label>
            <input type="checkbox" id="standort-12" value="Dresden">
            Dresden
          </label>
          <label>
            <input type="checkbox" id="standort-13" value="Hanover">
            Hanover
          </label>
          <label>
            <input type="checkbox" id="standort-14" value="Nuremberg">
            Nuremberg
          </label>
          <label>
            <input type="checkbox" id="standort-15" value="Duisburg">
            Duisburg
          </label>
        </div>
      </div>
      
      <!-- Gesamtbetrag -->
      <div class="form-group">
        <label for="gesamtbetrag">Gesamtbetrag (€):</label>
        <input type="number" id="gesamtbetrag" min="0" step="0.01" placeholder="0.00" required>
      </div>
      
      <!-- Berechnungs-Badge -->
      <div id="berechnung-badge">
        💰 Betrag pro Standort: 0.00 €
      </div>
      
      <!-- Buttons -->
      <div class="button-group">
        <button type="button" id="save-btn">💾 Speichern</button>
        <button type="button" id="abrechnung-btn">📋 Zur Abrechnung</button>
      </div>
    </form>
  </div>
  
  <!-- Dein Script -->
  <script src="index.js"></script>
</body>
</html>
