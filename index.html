<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autohaus Abrechnung Power-Up</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #172b4d;
        }

        select,
        input {
            width: 100%;
            padding: 8px;
            border: 2px solid #dfe1e6;
            border-radius: 4px;
            font-size: 14px;
        }

        select:focus,
        input:focus {
            border-color: #0079bf;
            outline: none;
        }

        .badge {
            background: #0079bf;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 10px;
            font-weight: 600;
        }

        button {
            background: #0079bf;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
        }

        button:hover {
            background: #005a8e;
        }
    </style>
</head>

<body>
    <div id="app">
        <h2 style="margin-bottom: 20px;">🚗 Autohaus Abrechnung</h2>

        <div class="field">
            <label for="autohaus">Autohaus / Standort</label>
            <select id="autohaus">
                <option value="">Bitte wählen...</option>
                <option value="Skoda Autohaus Thormann Stendal">Skoda Autohaus Thormann Stendal</option>
                <option value="Skoda Autohaus Thormann Gardelegen">Skoda Autohaus Thormann Gardelegen</option>
                <option value="Skoda Autohaus Mothor Brandenburg">Skoda Autohaus Mothor Brandenburg</option>
                <option value="Volkswagen Autohaus Brandenburg">Volkswagen Autohaus Brandenburg</option>
                <option value="Ford/Dehleffs Autocenter Brandenburg">Ford/Dehleffs Autocenter Brandenburg</option>
                <option value="Ford/Mitsubishi Autocenter Stendal">Ford/Mitsubishi Autocenter Stendal</option>
                <option value="Ford/Mitsubishi Autocenter Gardelegen">Ford/Mitsubishi Autocenter Gardelegen</option>
                <option value="Mitsubishi Brandenburg">Mitsubishi Brandenburg</option>
            </select>
        </div>

        <div class="field">
            <label for="standorte">Anzahl Standorte</label>
            <input type="number" id="standorte" min="1" value="1">
        </div>

        <div class="field">
            <label for="paket">Paket</label>
            <select id="paket">
                <option value="">Bitte wählen...</option>
                <option value="SocialMediaMarketing-Paket Recruiting mittel|5|425">SocialMediaMarketing-Paket Recruiting
                    mittel (5 Std - 425€)</option>
                <option value="SocialMediaMarketing-Paket Recruiting klein|3|255">SocialMediaMarketing-Paket Recruiting
                    klein (3 Std - 255€)</option>
                <option value="SocialMediaMarketing-Paket mittel|6|510">SocialMediaMarketing-Paket mittel (6 Std - 510€)
                </option>
                <option value="SocialMediaMarketing-Paket klein|5|425">SocialMediaMarketing-Paket klein (5 Std - 425€)
                </option>
                <option value="Marketing-Paket Kampagne|14|1190">Marketing-Paket Kampagne (14 Std - 1190€)</option>
            </select>
        </div>

        <div class="field">
            <label for="stunden">Stunden</label>
            <input type="number" id="stunden" min="0" step="0.5" value="0">
        </div>

        <div class="field">
            <label for="gesamtbetrag">Gesamtbetrag (€)</label>
            <input type="number" id="gesamtbetrag" min="0" step="0.01" value="0">
        </div>

        <div class="field">
            <label for="betrag_pro_standort">Betrag pro Standort (€)</label>
            <input type="number" id="betrag_pro_standort" min="0" step="0.01" value="0" readonly>
        </div>

        <div class="badge" id="berechnung-badge">
            💰 Betrag pro Standort: 0,00 €
        </div>

        <button id="save-btn">Speichern</button>
        <button id="abrechnung-btn" style="background: #5aac44; margin-top: 10px;">✓ Zur Abrechnung</button>
    </div>

    <script src="./index.js"></script>
</body>

</html>
